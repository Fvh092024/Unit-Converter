<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script src="index.js" defer></script>
  </head>
  <body>
    <main>
      <div id="card-holder">
        <section id="converter">
          <h3>Metric/Imperial Unit Conversion</h3>
          <input type="text" id="input-El" />
          <button id="convert-btn">Convert</button>
          <section id="numeric-value"></section>
        </section>
        <section id="all-values">
          <article class="ind-values">
            <h5 class="unit-header">Length (Meter/Feet)</h5>
            <br />
            <p id="length-para">
              20 meters = 65.616 feet | 20 feet = 6.096 meters
            </p>
          </article>
          <article class="ind-values">
            <h5 class="unit-header">Volume (Liters/Gallons)</h5>
            <br />
            <p id="volume-para">
              20 liters = 5.284 gallons | 20 gallons = 75.708 liters
            </p>
          </article>
          <article class="ind-values">
            <h5 class="unit-header">Mass (Kilograms/Pounds)</h5>
            <br />
            <p id="mass-para">
              20 kilos = 44.092 pounds | 20 pounds = 9.072 kilos
            </p>
          </article>
        </section>
      </div>
    </main>
  </body>
</html>
